name: Проверка сайта

# Защита от регрессий: битые ссылки, забытая сборка версий, возврат
# text-rendering: optimizeLegibility (он ломал вариативные шрифты в Safari).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: lastmod в sitemap.xml считается по дате коммита
          # последнего изменения site.md и cases/.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ссылки, разметка и стили
        run: python3 scripts/check_site.py

      - name: Версии ресурсов актуальны
        run: |
          python3 build_index.py
          # sitemap.xml исключён: его lastmod считается по дате коммита,
          # который CI и проверяет, поэтому дата законно отличается на день.
          if ! git diff --quiet -- . ':(exclude)sitemap.xml'; then
            echo "::error::build_index.py изменил файлы. Запустите его локально и закоммитьте результат."
            git diff --stat
            exit 1
          fi
